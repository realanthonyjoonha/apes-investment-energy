name: Morning Brief Agent

on:
  schedule:
    # 6:00 AM Pacific (13:00 UTC) — Monday through Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MMD_API_KEY: ${{ secrets.MMD_API_KEY }}
  GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
  GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
  GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
  GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}

jobs:
  run-morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Safety timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Morning Brief Agent
        run: python scripts/run_agent.py --agent morning-brief

      - name: Post-run summary
        if: always()
        run: echo "Morning Brief completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
